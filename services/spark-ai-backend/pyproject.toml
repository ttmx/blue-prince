[project]
name = "spark-ai-backend"
version = "0.1.0"
description = "Private OCR and embedding API for a Spark/DGX-hosted model stack."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.124.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.12.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.38.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
